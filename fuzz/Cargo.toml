# Fuzz targets, run with cargo-fuzz on a nightly toolchain:
#   cargo +nightly fuzz run <target>
# A separate crate (its own workspace) so the main crate stays on the pinned
# toolchain and libfuzzer-sys never enters its dependency tree.
[package]
name = "parkay-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
parkay = { path = "..", features = ["internals"] }
# The baseline the metadata targets compare against, as in `bench-support`.
parquet = { version = "60.2.0", default-features = false }

[[bin]]
name = "thrift_skip"
path = "fuzz_targets/thrift_skip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "thrift_consistency"
path = "fuzz_targets/thrift_consistency.rs"
test = false
doc = false
bench = false

[[bin]]
name = "thrift_arrow_diff"
path = "fuzz_targets/thrift_arrow_diff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "thrift_marking"
path = "fuzz_targets/thrift_marking.rs"
test = false
doc = false
bench = false

[[bin]]
name = "thrift_structured"
path = "fuzz_targets/thrift_structured.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metadata_open"
path = "fuzz_targets/metadata_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metadata_arrow_diff"
path = "fuzz_targets/metadata_arrow_diff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metadata_structured"
path = "fuzz_targets/metadata_structured.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "deny"
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"
redundant_imports = "warn"
unreachable_code = "warn"
unused_qualifications = "warn"

[lints.cargo]
unused_dependencies = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -2 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
exit = "warn"

[workspace]
