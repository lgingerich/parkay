# Project task runner: `cargo xtask <command>`. See `cargo xtask help`.
[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
rustc-demangle = "0.1.28"
# Reads cargo's JSON messages and Criterion's result files. Already built for criterion.
serde_json = "1.0.154"

[lints]
workspace = true
